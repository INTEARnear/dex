[package]
name = "otc-dex"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5.30", default-features = false, features = ["unstable"] }
intear-dex-common = { path = "../../intear-dex-common", features = ["dex"] }
otc-dex-types = { path = "types", features = ["dex"] }
crypto-bigint = { version = "0.6.1", default-features = false }
