[package]
name = "xyk-dex"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
near-sdk = { version = "5", default-features = false, features = ["unstable"] }
intear-dex-types = { path = "../../intear-dex-types", features = ["dex"] }
xyk-dex-types = { path = "types", features = ["dex"] }
talc = { version = "4.4.3", default-features = false, features = ["lock_api"] }

[dev-dependencies]
near-sdk = { version = "5", features = ["unit-testing"] }
