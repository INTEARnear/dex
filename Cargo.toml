[workspace]
members = [
    "intear-dex-types",
    "dexes/simple-amm",
    "dexes/minimal",
    "dexes/otc",
    "dexes/xyk",
    "dexes/xyk/types",
    "intear-dex-management",
    "test-support",
]

[package]
name = "intear-dex"
description = "cargo-near-new-project-description"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/INTEARnear/dex"

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "5.29", default-features = false, features = [
    "unstable",
] }
wasmi = { version = "1", default-features = false }
intear-dex-types = { path = "./intear-dex-types", features = ["json"] }
near-contract-standards = "5.29"

[dev-dependencies]
near-sdk = { version = "5.29", features = ["unit-testing"] }
near-workspaces = { version = "0.22", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
near-crypto = "0.34.2"
xyk-dex-types = { path = "./dexes/xyk/types" }
intear-dex-test-support = { path = "./test-support" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true # deny(clippy::arithmetic_side_effects) makes this unnecessary, but could be a bug in a dependency. increases gas usage by 3.3%

[profile.release.package.wasmi]
opt-level = 2

[profile.release.package.wasmparser]
opt-level = 2

[profile.release.package.wasmi_ir]
opt-level = 2

[profile.release.package.wasmi_core]
opt-level = 2

[profile.release.package.wasmi_collections]
opt-level = 2

[profile.release.package.xyk-dex]
opt-level = 'z'
