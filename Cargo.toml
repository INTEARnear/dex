[workspace]
members = [
    "intear-dex-common",
    "intear-dex-types",
    "chunked-upgrade",
    "dexes/test-dex",
    "dexes/test-dex/types",
    "dexes/otc",
    "dexes/otc/types",
    "dexes/xyk",
    "dexes/xyk/types",
    "dexes/amp",
    "dexes/amp/types",
    "intear-dex-management",
]

[package]
name = "intear-dex"
description = "cargo-near-new-project-description"
version = "0.1.0"
edition = "2024"
repository = "https://github.com/INTEARnear/dex"
autotests = false

[lib]
crate-type = ["cdylib", "rlib"]

[[test]]
name = "integration"
path = "tests/main.rs"

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.0"
image_digest = "sha256:51ab40efd798eae26c0dc71180909303f10bb4988b15ce3a18522c5be06e277e"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
]

[dependencies]
near-sdk = { version = "5.30", default-features = false, features = [
    "unstable",
    "deterministic-account-ids",
] }
wasmi = { version = "1", default-features = false }
intear-dex-common = { path = "./intear-dex-common" }
intear-dex-types = { path = "./intear-dex-types" }
near-contract-standards = "5.30"
lz4_flex = { version = "0.14", default-features = false, features = [
    "alloc",
    "safe-encode",
] }

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
near-workspaces = { version = "0.24", features = ["unstable"] }
near-sandbox = { version = "0.4", features = ["singleton_cleanup"] }
libc = "0.2"
tokio = { version = "1.12.0", features = ["full"] }
near-crypto = "0.38"
xyk-dex-types = { path = "./dexes/xyk/types" }
amp-dex-types = { path = "./dexes/amp/types" }
otc-dex-types = { path = "./dexes/otc/types" }
test-dex-types = { path = "./dexes/test-dex/types" }
near-primitives = "0.38"
near-jsonrpc-client = "0.23"
near-jsonrpc-primitives = "0.38"
lz4_flex = "0.14"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true # deny(clippy::arithmetic_side_effects) makes this unnecessary, but could be a bug in a dependency. increases gas usage by 3.3%

# The dex interpreter at full speed: it runs every dex instruction many times over, and this
# takes 2.8 TGas off a swap for 13 KB more code
[profile.release.package.wasmi]
opt-level = 3

[profile.release.package.wasmparser]
opt-level = 3

[profile.release.package.wasmi_ir]
opt-level = 3

[profile.release.package.wasmi_core]
opt-level = 3

[profile.release.package.wasmi_collections]
opt-level = 3

[profile.release.package.xyk-dex]
opt-level = 'z'
