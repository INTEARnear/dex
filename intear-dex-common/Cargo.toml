[package]
name = "intear-dex-common"
version = "0.1.0"
edition = "2024"

[dependencies]
ethnum = "1.5.3"
near-sdk = { version = "5", default-features = false }

[dev-dependencies]
# The types are near-sdk types, which only build outside of a contract with this
near-sdk = { version = "5", default-features = false, features = ["non-contract-usage"] }

[features]
abi = ["near-sdk/abi"]
# Host functions for dex code, and the shared code that uses them
dex = ["near-sdk/unstable"]
