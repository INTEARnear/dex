name: Test
on:
  push:
    branches:
      - main

jobs:
  code-formatting:
    name: Code Formatting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Apply patches to crates
        run: cargo install patch-crate --version 0.1.13 --locked && cargo patch-crate --force
      - run: cargo fmt --check

  code-linter:
    name: Code Linter
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Apply patches to crates
        run: cargo install patch-crate --version 0.1.13 --locked && cargo patch-crate --force
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev
      - name: Run cargo clippy
        run: |
          rustup component add clippy
          cargo clippy --all-features --workspace --tests -- --warn clippy::all

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Apply patches to crates
        run: cargo install patch-crate --version 0.1.13 --locked && cargo patch-crate --force
      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Install tooling
        run: sudo apt-get update && sudo apt-get install -y binaryen
      - name: Run cargo test
        run: cargo test

  management-cli-tests:
    name: Management CLI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Apply patches to crates
        run: cargo install patch-crate --version 0.1.13 --locked && cargo patch-crate --force
      - name: Install cargo-near CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/download/cargo-near-v0.22.0/cargo-near-installer.sh | sh
      - name: Install tooling and native dependencies
        run: sudo apt-get update && sudo apt-get install -y binaryen libudev-dev
      - name: Run cargo test
        run: cargo test --package intear-dex-management
