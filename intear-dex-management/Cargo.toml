[package]
name = "intear-dex-management"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "near-intear-dex-management"
path = "src/main.rs"

[dependencies]
near-cli-rs = { version = "0.30.1", default-features = false, features = ["ledger"] }
interactive-clap = "0.3.2"
interactive-clap-derive = "0.3.2"
clap = { version = "4", features = ["derive"] }
strum = { version = "0.24", features = ["derive"] }
inquire = "0.9.4"
color-eyre = "0.6"
shell-words = "1"
thiserror = "2"
tracing = "0.1"
tracing-indicatif = "0.3"
prettytable = "0.10"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
near-primitives = "0.37"
near-jsonrpc-client = "0.22"
near-jsonrpc-primitives = "0.37"
near-sdk = { version = "5", default-features = false, features = ["non-contract-usage"] }
intear-dex-types = { path = "../intear-dex-types", features = ["json"] }
xyk-dex-types = { path = "../dexes/xyk/types" }
crypto-bigint = { version = "0.6.1", default-features = false }

[dev-dependencies]
intear-dex-test-support = { path = "../test-support" }
near-workspaces = "0.22"
tokio = { version = "1.12.0", features = ["macros", "rt-multi-thread"] }
insta = { version = "1", features = ["filters"] }
tempfile = "3"
regex = "1"
